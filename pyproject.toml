[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "salary-simple-linear-regression"
version = "2.0.0"
description = "Production-grade Simple Linear Regression engine for salary prediction with full statistical inference"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aranya2801", email = "aranya2801@users.noreply.github.com" }]
keywords = [
  "machine-learning", "regression", "statistics", "salary",
  "data-science", "linear-regression", "ols", "inference",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "statsmodels>=0.14.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "black", "isort", "flake8", "bandit"]
notebook = ["jupyterlab", "ipykernel", "ipywidgets", "plotly"]

[project.urls]
Homepage    = "https://github.com/Aranya2801/Salary-Simple-Linear-Regression"
Repository  = "https://github.com/Aranya2801/Salary-Simple-Linear-Regression"
Issues      = "https://github.com/Aranya2801/Salary-Simple-Linear-Regression/issues"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
